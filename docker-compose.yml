version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/reviewpost
      - REDIS_URL=redis://redis:6379
    depends_on:
      - db
      - redis
    networks:
      - reviewpost_network

  db:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: reviewpost
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - reviewpost_network

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    networks:
      - reviewpost_network

networks:
  reviewpost_network:
    driver: bridge

volumes:
  pgdata:
  redisdata:
