<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --brand-primary: {
                    {
                    brand_primary
                }
            }

            ;

            --brand-secondary: {
                    {
                    brand_secondary
                }
            }

            ;

            --brand-text: {
                    {
                    brand_text
                }
            }

            ;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1080px;
            height: 1080px;
            overflow: hidden;

            font-family: {
                    {
                    font_family
                }
            }

            ;
            background: #f8f8f8;
            display: flex;
            flex-direction: row;
            position: relative;
        }

        /* ── Left: Product image panel ── */
        .product-panel {
            width: 50%;
            height: 100%;
            position: relative;
            flex-shrink: 0;
            overflow: hidden;
            background: #e9e9e9;
        }

        .product-panel img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Gradient overlay on image for readability */
        .product-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 200px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.6), transparent);
            padding: 24px;
            display: flex;
            align-items: flex-end;
        }

        .product-name-overlay {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.3;
        }

        /* ── Right: Review panel ── */
        .review-panel {
            width: 50%;
            height: 100%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            padding: 52px 48px;
            position: relative;
        }

        /* Top accent line */
        .review-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 8px;
            background: linear-gradient(90deg, var(--brand-primary), var(--brand-secondary));
        }

        .product-label {
            font-size: 22px;
            font-weight: 700;
            color: var(--brand-primary);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 12px;
            margin-top: 16px;
        }

        .product-name-text {
            font-size: 36px;
            font-weight: 800;
            color: #1a1a1a;
            line-height: 1.3;
            margin-bottom: 32px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .stars {
            font-size: 40px;
            color: #FFB800;
            letter-spacing: 4px;
            margin-bottom: 20px;
        }

        .review-text {
            flex: 1;
            font-size: 34px;
            font-weight: 500;
            color: #333333;
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 6;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            font-style: italic;
        }

        .author-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #eeeeee;
        }

        .author-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--brand-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
        }

        .author-name {
            font-size: 24px;
            font-weight: 700;
            color: #1a1a1a;
        }

        /* CTA button */
        .cta-button {
            display: block;
            width: 100%;
            margin-top: 24px;
            padding: 20px;
            background: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary));
            color: #ffffff;
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            border-radius: 16px;
            text-decoration: none;
            letter-spacing: 1px;
        }

        /* Bottom: logo */
        .bottom-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 20px;
        }

        .logo-wrap {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            overflow: hidden;
            background: #f0f0f0;
        }

        .logo-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .biz-name-small {
            font-size: 22px;
            font-weight: 600;
            color: #888888;
        }
    </style>
</head>

<body>
    <!-- Left: product image -->
    <div class="product-panel">
        <img src="{{product_image_url}}" alt="{{product_name}}" onerror="this.style.background='#ddd'" />
        <div class="product-overlay">
            <div class="product-name-overlay">{{product_name}}</div>
        </div>
    </div>

    <!-- Right: review -->
    <div class="review-panel">
        <div class="product-label">Customer Review</div>
        <div class="product-name-text">{{product_name}}</div>
        <div class="stars">{{stars}}</div>

        <p class="review-text">"{{review_text}}"</p>

        <div class="author-row">
            <div class="author-avatar">{{author_initial}}</div>
            <span class="author-name">{{author_name}}</span>
        </div>

        <a class="cta-button" href="{{product_link}}">🛍 Shop Now</a>

        <div class="bottom-logo">
            <div class="logo-wrap">
                <img src="{{logo_url}}" alt="Logo" onerror="this.style.display='none'" />
            </div>
            <span class="biz-name-small">{{business_name}}</span>
        </div>
    </div>
</body>

</html>
