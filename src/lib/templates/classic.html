<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --brand-primary: {{brand_primary}};
    --brand-secondary: {{brand_secondary}};
    --brand-text: {{brand_text}};
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    font-family: {{font_family}};
    background: linear-gradient(145deg, var(--brand-primary) 0%, color-mix(in srgb, var(--brand-primary) 80%, black) 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 64px 72px;
    position: relative;
  }

  /* Decorative circles */
  body::before {
    content: '';
    position: absolute;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: rgba(255,255,255,0.04);
    top: -180px;
    right: -180px;
  }
  body::after {
    content: '';
    position: absolute;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: rgba(255,255,255,0.04);
    bottom: -120px;
    left: -120px;
  }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: center;
    gap: 24px;
    width: 100%;
    z-index: 1;
  }

  .logo-wrap {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: 3px solid rgba(255,255,255,0.4);
    overflow: hidden;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .business-name {
    font-size: 36px;
    font-weight: 700;
    color: rgba(255,255,255,0.95);
    letter-spacing: -0.5px;
    line-height: 1.2;
  }

  /* ── Quote block ── */
  .quote-block {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    z-index: 1;
    padding: 0 8px;
  }

  .quote-mark {
    font-size: 140px;
    line-height: 0.6;
    color: rgba(255,255,255,0.15);
    font-family: Georgia, serif;
    margin-bottom: 24px;
    align-self: flex-start;
  }

  .review-text {
    font-size: 48px;
    font-weight: 600;
    color: #ffffff;
    line-height: 1.5;
    text-align: center;
    display: -webkit-box;
    -webkit-line-clamp: 5;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-overflow: ellipsis;
    max-height: 360px;
  }

  /* ── Footer ── */
  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    z-index: 1;
    background: rgba(0,0,0,0.2);
    border-radius: 20px;
    padding: 24px 36px;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1);
  }

  .author-info { display: flex; flex-direction: column; gap: 6px; }

  .author-name {
    font-size: 28px;
    font-weight: 700;
    color: #ffffff;
  }

  .source-label {
    font-size: 22px;
    color: rgba(255,255,255,0.6);
    font-weight: 400;
  }

  .stars {
    font-size: 40px;
    color: #FFD700;
    letter-spacing: 4px;
    filter: drop-shadow(0 0 8px rgba(255,215,0,0.5));
  }
</style>
</head>
<body>
  <div class="header">
    <div class="logo-wrap">
      <img src="{{logo_url}}" alt="Logo" onerror="this.style.display='none'" />
    </div>
    <span class="business-name">{{business_name}}</span>
  </div>

  <div class="quote-block">
    <div class="quote-mark">"</div>
    <p class="review-text">{{review_text}}</p>
  </div>

  <div class="footer">
    <div class="author-info">
      <span class="author-name">{{author_name}}</span>
      <span class="source-label">{{source}}</span>
    </div>
    <div class="stars">{{stars}}</div>
  </div>
</body>
</html>
