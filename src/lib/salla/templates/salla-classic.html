<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --brand-primary: {{brand_primary}};
    --brand-secondary: {{brand_secondary}};
    --brand-text: {{brand_text}};
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    font-family: 'Cairo', 'Arial', sans-serif;
    background: #ffffff;
    display: flex;
    flex-direction: column;
    position: relative;
    direction: rtl;
  }

  .top-bar {
    height: 8px;
    background: linear-gradient(90deg, var(--brand-primary), var(--brand-secondary));
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 36px 56px 24px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .logo-wrap {
    width: 64px;
    height: 64px;
    border-radius: 14px;
    overflow: hidden;
    background: #f0f0f0;
    flex-shrink: 0;
  }

  .logo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .business-name {
    font-size: 28px;
    font-weight: 700;
    color: #1a1a1a;
  }

  .source-badge {
    padding: 8px 20px;
    border-radius: 24px;
    background: #f5f5f5;
    font-size: 18px;
    font-weight: 600;
    color: #888;
  }

  .content {
    flex: 1;
    display: flex;
    flex-direction: row;
    padding: 16px 56px 32px;
    gap: 48px;
  }

  .product-side {
    width: 400px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .product-image-wrap {
    width: 400px;
    height: 400px;
    border-radius: 24px;
    overflow: hidden;
    background: #f5f5f5;
    box-shadow: 0 8px 32px rgba(0,0,0,0.08);
  }

  .product-image-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .product-name {
    font-size: 26px;
    font-weight: 700;
    color: #1a1a1a;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-align: center;
  }

  .review-side {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 24px;
  }

  .stars {
    font-size: 48px;
    color: #FFB800;
    letter-spacing: 6px;
    filter: drop-shadow(0 2px 4px rgba(255,184,0,0.3));
  }

  .review-text {
    font-size: 36px;
    font-weight: 600;
    color: #333;
    line-height: 1.7;
    display: -webkit-box;
    -webkit-line-clamp: 6;
    -webkit-box-orient: vertical;
    overflow: hidden;
    position: relative;
    padding-right: 24px;
    border-right: 4px solid var(--brand-primary);
  }

  .author-name {
    font-size: 26px;
    font-weight: 700;
    color: var(--brand-primary);
  }

  .footer {
    padding: 24px 56px;
    background: #fafafa;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid #eee;
  }

  .cta-button {
    padding: 16px 40px;
    background: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary));
    color: #ffffff;
    font-size: 26px;
    font-weight: 700;
    border-radius: 14px;
    text-decoration: none;
    display: inline-block;
  }

  .salla-badge {
    font-size: 18px;
    color: #bbb;
    font-weight: 400;
  }
</style>
</head>
<body>
  <div class="top-bar"></div>

  <div class="header">
    <div class="brand">
      <div class="logo-wrap">
        <img src="{{logo_url}}" alt="Logo" onerror="this.style.display='none'" />
      </div>
      <span class="business-name">{{business_name}}</span>
    </div>
    <span class="source-badge">{{source}}</span>
  </div>

  <div class="content">
    <div class="product-side">
      <div class="product-image-wrap">
        <img src="{{product_image_url}}" alt="{{product_name}}" onerror="this.parentElement.style.background='linear-gradient(135deg,#f0f0f0,#e0e0e0)'" />
      </div>
      <div class="product-name">{{product_name}}</div>
    </div>

    <div class="review-side">
      <div class="stars">{{stars}}</div>
      <p class="review-text">{{review_text}}</p>
      <span class="author-name">— {{author_name}}</span>
    </div>
  </div>

  <div class="footer">
    <a class="cta-button" href="{{product_link}}">🛍 اطلب الآن</a>
    <span class="salla-badge">Powered by سلّة</span>
  </div>
</body>
</html>
