<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --brand-primary: {{brand_primary}};
    --brand-secondary: {{brand_secondary}};
    --brand-text: {{brand_text}};
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    font-family: 'Cairo', 'Arial', sans-serif;
    background: linear-gradient(160deg, var(--brand-primary) 0%, var(--brand-secondary) 50%, #1a1a2e 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 56px 64px;
    position: relative;
    direction: rtl;
  }

  body::before {
    content: '';
    position: absolute;
    width: 700px;
    height: 700px;
    border-radius: 50%;
    background: rgba(255,255,255,0.04);
    top: -200px;
    left: -200px;
  }

  body::after {
    content: '';
    position: absolute;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: rgba(255,255,255,0.03);
    bottom: -150px;
    right: -150px;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    z-index: 1;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .logo-wrap {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    overflow: hidden;
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.3);
    flex-shrink: 0;
  }

  .logo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .business-name {
    font-size: 30px;
    font-weight: 700;
    color: rgba(255,255,255,0.95);
  }

  .source-badge {
    padding: 8px 20px;
    border-radius: 24px;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(8px);
    font-size: 18px;
    font-weight: 600;
    color: rgba(255,255,255,0.8);
    border: 1px solid rgba(255,255,255,0.15);
  }

  .rating-block {
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    margin-top: 16px;
  }

  .rating-number {
    font-size: 120px;
    font-weight: 900;
    color: #ffffff;
    line-height: 1;
    text-shadow: 0 4px 24px rgba(0,0,0,0.2);
  }

  .rating-label {
    font-size: 24px;
    font-weight: 600;
    color: rgba(255,255,255,0.6);
    letter-spacing: 4px;
  }

  .stars {
    font-size: 56px;
    color: #FFD700;
    letter-spacing: 8px;
    filter: drop-shadow(0 0 12px rgba(255,215,0,0.5));
  }

  .review-card {
    z-index: 1;
    width: 100%;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(20px);
    border-radius: 28px;
    padding: 40px 48px;
    border: 1px solid rgba(255,255,255,0.12);
  }

  .review-text {
    font-size: 36px;
    font-weight: 600;
    color: #ffffff;
    line-height: 1.7;
    text-align: center;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 24px;
  }

  .review-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .author-info {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .author-name {
    font-size: 24px;
    font-weight: 700;
    color: #ffffff;
  }

  .product-name {
    font-size: 20px;
    color: rgba(255,255,255,0.6);
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .product-thumb {
    width: 80px;
    height: 80px;
    border-radius: 16px;
    overflow: hidden;
    background: rgba(255,255,255,0.1);
    border: 2px solid rgba(255,255,255,0.2);
    flex-shrink: 0;
  }

  .product-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .footer {
    z-index: 1;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .cta-button {
    padding: 18px 44px;
    background: #ffffff;
    color: var(--brand-primary);
    font-size: 26px;
    font-weight: 800;
    border-radius: 16px;
    text-decoration: none;
    display: inline-block;
    box-shadow: 0 8px 32px rgba(0,0,0,0.15);
  }

  .salla-badge {
    font-size: 18px;
    color: rgba(255,255,255,0.4);
  }
</style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="logo-wrap">
        <img src="{{logo_url}}" alt="Logo" onerror="this.style.display='none'" />
      </div>
      <span class="business-name">{{business_name}}</span>
    </div>
    <span class="source-badge">{{source}}</span>
  </div>

  <div class="rating-block">
    <div class="rating-number">{{rating}}</div>
    <div class="rating-label">تقييم العميل</div>
    <div class="stars">{{stars}}</div>
  </div>

  <div class="review-card">
    <p class="review-text">"{{review_text}}"</p>
    <div class="review-meta">
      <div class="author-info">
        <span class="author-name">{{author_name}}</span>
        <span class="product-name">{{product_name}}</span>
      </div>
      <div class="product-thumb">
        <img src="{{product_image_url}}" alt="{{product_name}}" onerror="this.style.display='none'" />
      </div>
    </div>
  </div>

  <div class="footer">
    <a class="cta-button" href="{{product_link}}">🛒 اطلب الآن</a>
    <span class="salla-badge">Powered by سلّة</span>
  </div>
</body>
</html>
