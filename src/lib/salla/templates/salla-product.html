<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --brand-primary: {{brand_primary}};
    --brand-secondary: {{brand_secondary}};
    --brand-text: {{brand_text}};
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    font-family: 'Cairo', 'Arial', sans-serif;
    background: #f8f7f4;
    display: flex;
    flex-direction: column;
    position: relative;
    direction: rtl;
  }

  .product-hero {
    height: 540px;
    position: relative;
    overflow: hidden;
    background: #e8e8e8;
  }

  .product-hero img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .product-hero-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, transparent 40%, rgba(0,0,0,0.7) 100%);
  }

  .hero-top {
    position: absolute;
    top: 24px;
    right: 32px;
    left: 32px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .brand-pill {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(12px);
    border-radius: 40px;
    padding: 8px 20px 8px 8px;
  }

  .brand-pill-logo {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    overflow: hidden;
    background: #f0f0f0;
  }

  .brand-pill-logo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .brand-pill-name {
    font-size: 18px;
    font-weight: 700;
    color: #1a1a1a;
  }

  .stars-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(12px);
    border-radius: 40px;
    padding: 10px 20px;
  }

  .stars-pill .stars-text {
    font-size: 28px;
    color: #FFD700;
    letter-spacing: 2px;
  }

  .stars-pill .rating-num {
    font-size: 22px;
    font-weight: 800;
    color: #ffffff;
  }

  .hero-bottom {
    position: absolute;
    bottom: 24px;
    right: 32px;
    left: 32px;
  }

  .product-title {
    font-size: 40px;
    font-weight: 800;
    color: #ffffff;
    line-height: 1.3;
    text-shadow: 0 2px 12px rgba(0,0,0,0.3);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .price-tag {
    display: inline-block;
    margin-top: 12px;
    padding: 8px 24px;
    background: var(--brand-primary);
    color: #ffffff;
    font-size: 28px;
    font-weight: 800;
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
  }

  .review-section {
    flex: 1;
    padding: 36px 48px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .quote-icon {
    font-size: 64px;
    color: var(--brand-primary);
    opacity: 0.3;
    line-height: 0.5;
    margin-bottom: 8px;
    font-family: Georgia, serif;
  }

  .review-text {
    font-size: 34px;
    font-weight: 600;
    color: #2a2a2a;
    line-height: 1.7;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .review-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 20px;
    border-top: 2px solid #eee;
  }

  .author-section {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .author-avatar {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--brand-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 800;
    color: #ffffff;
    flex-shrink: 0;
  }

  .author-details {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .author-name {
    font-size: 24px;
    font-weight: 700;
    color: #1a1a1a;
  }

  .author-label {
    font-size: 18px;
    color: #999;
  }

  .cta-button {
    padding: 16px 36px;
    background: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary));
    color: #ffffff;
    font-size: 24px;
    font-weight: 700;
    border-radius: 14px;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.1);
  }
</style>
</head>
<body>
  <div class="product-hero">
    <img src="{{product_image_url}}" alt="{{product_name}}" onerror="this.parentElement.style.background='linear-gradient(135deg,#e0e0e0,#c0c0c0)'" />
    <div class="product-hero-overlay"></div>

    <div class="hero-top">
      <div class="brand-pill">
        <div class="brand-pill-logo">
          <img src="{{logo_url}}" alt="Logo" onerror="this.style.display='none'" />
        </div>
        <span class="brand-pill-name">{{business_name}}</span>
      </div>
      <div class="stars-pill">
        <span class="stars-text">{{stars}}</span>
        <span class="rating-num">{{rating}}/5</span>
      </div>
    </div>

    <div class="hero-bottom">
      <div class="product-title">{{product_name}}</div>
      <div class="price-tag">{{product_price}}</div>
    </div>
  </div>

  <div class="review-section">
    <div>
      <div class="quote-icon">"</div>
      <p class="review-text">{{review_text}}</p>
    </div>

    <div class="review-footer">
      <div class="author-section">
        <div class="author-avatar">{{author_initial}}</div>
        <div class="author-details">
          <span class="author-name">{{author_name}}</span>
          <span class="author-label">عميل مُوثّق ✓</span>
        </div>
      </div>
      <a class="cta-button" href="{{product_link}}">اطلب الآن 🛍</a>
    </div>
  </div>
</body>
</html>
